# ElvonOS V1 — Hyprland Compositor Configuration
# Infrastructure configuration for ElvonOS Android-First Desktop

# Monitors (Default auto; display settings service overrides via hyprctl)
monitor=,preferred,auto,1

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
    sensitivity = 0
}

# General appearance (Clean, minimal aesthetic suited for Android apps)
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 5
        passes = 2
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 4, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Window Rules for Android / Waydroid applications
windowrulev2 = float, class:^(Waydroid)$
windowrulev2 = center, class:^(Waydroid)$
windowrulev2 = round, class:^(Waydroid)$

# Layer rules for ElvonOS desktop shell
layerrule = blur, elvonos-shell
layerrule = ignorezero, elvonos-shell

# Basic infrastructure keybindings
$mainMod = SUPER

bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, SPACE, togglefloating,

# Workspace switching
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Autostart ElvonOS services
exec-once = /usr/bin/elvonos-session-startup
