# Prefer the noise-suppressed virtual microphone when it is available.
wireplumber.settings = {
  default.audio.source = "echo-cancel-source"
}

# Keep ALSA nodes powered while idle. Power-save transitions are a common
# source of clicks and pops on laptop audio codecs.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.*" },
      { node.name = "~alsa_input.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
