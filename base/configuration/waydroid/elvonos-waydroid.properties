# ElvonOS Waydroid default properties
# Multi-window support for desktop integration
persist.waydroid.multi_windows=true
persist.waydroid.suspend=false
# Graphics: GBM gralloc + Mesa EGL (software rendering for QEMU/VM)
ro.hardware.gralloc=gbm
ro.hardware.egl=mesa
# ElvonOS-specific: disable window decorations (Win8DE style)
persist.waydroid.hide_window_decorations=true
# Audio: PipeWire backend
persist.waydroid.audio_backend=pipewire
# Clipboard sync with Wayland
persist.waydroid.clipboard_sync=true
# Network: allow host access
persist.waydroid.net_mode=nat
