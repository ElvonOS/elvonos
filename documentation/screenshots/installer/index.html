<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ElvonOS 1.0 — screenshots</title>
<style>
  body { background:#141821; color:#e6e9ef; font-family:system-ui, sans-serif; margin:0; padding:32px; }
  h1 { font-weight:600; margin:0 0 4px; }
  p.lead { color:#9aa4b2; margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(420px,1fr)); gap:24px; }
  figure { margin:0; background:#1c2230; border:1px solid #2a3345; border-radius:10px; overflow:hidden; }
  img { display:block; width:100%; height:auto; }
  figcaption { padding:12px 16px; color:#c8d0dc; font-size:14px; }
  code { color:#9fd0ff; }
</style>
</head>
<body>
  <h1>ElvonOS 1.0 — English screenshots</h1>
  <p class="lead">Live session, installer and update settings, captured on 2026-11-10 (QEMU, 1280×800).</p>

  <div class="grid">    <figure>
      <img src="start-menu-1.0.7.png" alt="Start screen with Restart and Shut down buttons">
      <figcaption><b>Start screen</b> — Metro tiles plus always-visible <code>Restart</code> and <code>Shut down</code> buttons.</figcaption>
    </figure>
    <figure>
      <img src="installer-language.png" alt="Installer language selection">
      <figcaption><b>Installer</b> — language selection (15 languages, English default).</figcaption>
    </figure>
    <figure>
      <img src="bob-start.png" alt="Start screen after installing with a custom user">
      <figcaption><b>After installation</b> — Start screen of a freshly installed system with the user-selected account <code>bob</code>.</figcaption>
    </figure>
    <figure>
      <img src="store-flathub-setup.png" alt="Store with Flathub setup banner">
      <figcaption><b>Store → Flathub setup</b> — banner and one-click setup when Flathub is missing.</figcaption>
    </figure>
    <figure>
      <img src="store-flathub-ready.png" alt="Store with Flathub catalog">
      <figcaption><b>Store with Flathub</b> — 3,400+ Linux apps, install/open actions, Android tab.</figcaption>
    </figure>
    <figure>
      <img src="settings-updates-log.png" alt="Settings update card with live log">
      <figcaption><b>Settings → Updates</b> — last check, OS/component counts and the live update log.</figcaption>
    </figure>
    <figure>
      <img src="settings-1.0.7.png" alt="Settings overview">
      <figcaption><b>Settings</b> — system overview with health card.</figcaption>
    </figure>
    <figure>
      <img src="settings-updates-1.0.7.png" alt="ElvonOS Updates card">
      <figcaption><b>Settings → Updates</b> — signed ElvonOS feed with Check, Download and Apply actions.</figcaption>
    </figure>
  </div>
  <p class="lead" style="margin-top:28px">Also hosted on SourceForge:
    <a href="https://sourceforge.net/projects/elvonos/files/screenshots/" style="color:#9fd0ff">sourceforge.net/projects/elvonos/files/screenshots</a>
  </p>
</body>
</html>
