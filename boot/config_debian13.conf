# ElvonOS Boot Configuration for Debian 13 Compatibility
# Generated during Phase 1 initialization

# Kernel parameters for base support
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
GRUB_CMDLINE_LINUX="root=UUID=... rw rootwait"

# Wayland/Hyprland specific flags
# Required for compatibility with Debian 13 kernel drivers
kernel.modules=nvidia_drm,amdgpu,nvidia_modeset
nvidia_drm.modeset=1

# Systemd mount options
XDG_RUNTIME_DIR=/run/user/$UID
TTY_SIZE=24x80
